<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#12031d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Adventure Quest" />
  <meta name="description" content="Adventure Quest: The Lost Kingdom — a retro platformer adventure game." />
  <meta name="screen-orientation" content="landscape" />
  <title>Adventure Quest: The Lost Kingdom</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icons/icon-192.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app-splash" aria-hidden="true">
    <div class="splash-logo">AQ</div>
    <div class="splash-text">Adventure Quest</div>
  </div>

  <div id="rotate-overlay">
    <div id="rotate-box">
      <div id="rotate-icon">📱</div>
      <p>Please rotate your device<br>to <strong>landscape</strong> to play!</p>
    </div>
  </div>

  <div id="pwa-install-panel" class="install-panel" hidden>
    <div class="install-panel__body">
      <div class="install-panel__title">Install Adventure Quest</div>
      <div class="install-panel__text">Add it to your home screen for a faster, app-like experience.</div>
      <div class="install-panel__actions">
        <button id="install-accept" class="install-btn primary">Install</button>
        <button id="install-dismiss" class="install-btn secondary">Later</button>
      </div>
    </div>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="mobile-controls">
      <div id="mobile-left">
        <button class="ctrl-btn" id="btn-left" aria-label="Move left">◀</button>
        <button class="ctrl-btn" id="btn-right" aria-label="Move right">▶</button>
      </div>
      <div id="mobile-right">
        <button class="ctrl-btn" id="btn-attack" aria-label="Attack">⚔</button>
        <button class="ctrl-btn" id="btn-jump" aria-label="Jump">▲</button>
      </div>
    </div>
  </div>

  <button id="install-btn" class="app-btn" title="Install app" aria-label="Install app">⬇</button>
  <button id="mute-btn" title="Toggle music and sound effects" aria-label="Toggle music and sound effects">🔊</button>

  <script src="game.js"></script>
</body>
</html>
